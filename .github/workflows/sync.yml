name: Sync Mojang metadata
on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: python sync_mojang.py
      - run: |
          git config user.name "sync-bot"; git config user.email "actions@github.com"
          git add -A && git diff --cached --quiet || git commit -m "sync: $(date -u +%F)"
          git push
